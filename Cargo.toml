[workspace]
resolver = "2"
members = [
    "crates/clypse-daemon",
    "crates/clypse-gui",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Clypse Team"]
license      = "GPL-3.0"
repository   = "https://github.com/clypse/clypse"
rust-version = "1.75"

[workspace.dependencies]
anyhow       = "1"
thiserror    = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs         = "5"
