[package]
name        = "clypse-gui"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[[bin]]
name = "clypse"
path = "src/main.rs"

[dependencies]
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
dirs       = { workspace = true }

# GTK4 + libadwaita — nativo Linux
gtk4       = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib       = "0.20"
gio        = "0.20"

# Async para IPC (thread separada do loop GTK)
tokio      = { workspace = true }

# Localização do binário daemon
which      = "6"

# System tray (StatusNotifierItem — COSMIC/GNOME/KDE panel)
ksni       = "0.2"
